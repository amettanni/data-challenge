clickhouse:
  host: localhost
  port: 8123
  database: pipeline
  username: default
  password: ""

dataset:
  row_count: 10000000
  batch_size: 50000
  anomaly_ratio: 0.001
  seed: 42

anomaly_detection:
  zscore_threshold: 3.0
  isolation_forest:
    contamination: 0.001
    random_state: 42
  dbscan:
    eps: 0.7
    min_samples: 15
  iqr:
    multiplier: 1.5
  ewma:
    threshold: 45
    alpha: 0.25
  ensemble:
    min_votes: 2

alerting:
  enabled: true
  threshold_score: 0.8
  sink: stdout
  file_path: logs/anomalies.jsonl


data_quality:
  events:
    - type: not_null
      column: value

    - type: not_null
      column: attribute

    - type: between
      column: value
      min: 0
      max: 200
  
    - type: unique
      columns: ["entity_id"]
